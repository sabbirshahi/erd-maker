<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- One SVG for every size; it follows the browser's light/dark theme. No .ico fallback:
         every browser this app supports (it needs ES2022 modules and WASM) reads SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBridge</title>
    <meta
      name="description"
      content="DBridge: DBML, a live diagram and Django models.py, always in sync. Browser-only ERD editor, no backend, no account."
    />

    <!-- Share links ('#d=...') are pasted into chat apps, so they need a card rather than a bare URL.
         og:image must be absolute: the crawlers that read it do not resolve relative paths against
         the share link. The card itself is generated from scripts/og-card.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DBridge" />
    <meta property="og:url" content="https://dbridge-app.vercel.app/" />
    <meta property="og:image" content="https://dbridge-app.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Two linked table cards, customers and orders, beside the line: DBML, a diagram and Django models, always in sync."
    />
    <meta property="og:title" content="DBridge — DBML, diagram and Django models in sync" />
    <meta
      property="og:description"
      content="Browser-only ERD editor. Write DBML, drag tables on a canvas, read the Django models.py — all three stay in sync. No backend, no account."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dbridge-app.vercel.app/og.png" />
    <link rel="canonical" href="https://dbridge-app.vercel.app/" />

    <script>
      try {
        var t = localStorage.getItem('dbridge:theme') || localStorage.getItem('erd-maker:theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
