<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The DBridge mark: the same two-tables-and-a-link icon the top bar uses (see Logo in
    src/app/Shell.tsx), stroked a little heavier because the header's 1.75 disappears once a
    browser draws this at 16px.

    Colours are the light and dark values of the erd-accent token in src/tokens.css. An SVG
    favicon can follow the browser's own theme, which a PNG cannot, so the mark stays visible on
    a dark tab strip instead of going nearly black.

    Note for editors: XML forbids a double hyphen inside a comment, so token names are written
    without their leading dashes here. A malformed favicon fails silently, as a blank tab icon.
  -->
  <style>
    .mark { stroke: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #818cf8; }
    }
  </style>
  <g class="mark" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="3" width="9" height="6.5" rx="1.25" />
    <rect x="12.5" y="14.5" width="9" height="6.5" rx="1.25" />
    <path d="M6.5 9.5v4.5a2.5 2.5 0 0 0 2.5 2.5h4" />
  </g>
</svg>
